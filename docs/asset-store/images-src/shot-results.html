<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  body { --w: 1920px; --h: 1080px; display: grid; grid-template-columns: 1fr 760px; gap: 90px; align-items: center; padding: 0 130px 0 140px; }
  .copy { display: grid; gap: 46px; }
</style></head>
<body>
  <div class="copy">
    <div class="headline">Every character your fonts <em>can't render</em>, per language.</div>
    <ul class="bullets">
      <li>Checks the font and its whole fallback chain, in TextMeshPro's own search order</li>
      <li>Ignores rich text tags and {placeholders}</li>
      <li>Shows which keys use each missing character</li>
      <li>Copy as characters or hex ranges for the Font Asset Creator</li>
    </ul>
  </div>
  <div class="shot"><img src="../../images/scanner-results.png" width="760" height="900" alt=""></div>
</body></html>

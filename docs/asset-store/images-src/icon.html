<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  body { --w: 160px; --h: 160px; position: relative; }
  .tile { --size: 92px; position: absolute; left: 22px; top: 14px; }
  .lens { left: 66px; top: 66px; width: 88px; height: 88px; }
</style></head>
<body>
  <!-- Icon: no text allowed. A missing-glyph "tofu" tile under a magnifier. -->
  <div class="tile missing"><div class="tofu"></div></div>
  <svg class="lens" viewBox="0 0 100 100">
    <circle cx="40" cy="40" r="26" fill="rgba(79,209,197,0.14)" stroke="#4fd1c5" stroke-width="8"/>
    <line x1="60" y1="60" x2="86" y2="86" stroke="#4fd1c5" stroke-width="11" stroke-linecap="round"/>
  </svg>
</body></html>

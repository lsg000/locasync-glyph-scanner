<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  /* Publisher profile picture (TinyRig). The Asset Store shows it as a small circle, so the mark is one bold
     letter plus the teal dot from the "TinyRig." wordmark on the banner, kept inside the central circle. */
  body { --w: 512px; --h: 512px; display: grid; place-items: center; }
  .mark { font-size: 340px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; transform: translate(0, -23px); }
  .mark .dot { color: var(--ok); }
</style></head>
<body>
  <div class="mark">T<span class="dot">.</span></div>
</body></html>
